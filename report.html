<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav id="navbar-icon" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <img src="assets/Haikyuu-Symbol.png" width="100px" alt="Haikyuu Symbol"
      class="rounded float-start" href="homepage.html"></img>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item active">
          <a class="nav-link" href="characters.html">Key Characters<span class="sr-only"></span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="games.html">Key Games</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="report.html">About</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </nav>

  <main class="container py-5">
    <form class="row g-3">
      <div class="col-md-6">
        <label for="name" class="form-label">Name:</label>
        <input type="text" name="name" class="form-control">
      </div>
      <div class="col-md-6">
        <label for="charName" class="form-label">Character Name:</label>
        <input type="text" name="charName" class="form-control">
      </div>
      <div class="col-md-6">
        <label for="position" class="form-label">Position:</label>
        <select id="pos" name="position" class="form-select">
          <option value="wspiker">Wing Spiker</option>
          <option value="lib">Libero</option>
          <option value="mblock">Middle Blocker</option>
          <option value=""></option>
          <option value=""></option>
        </select>
      </div>
      <div class="col-12">
        <label for="why" class="form-label">Why Should We Add This Character?</label>
        <textarea name="why" rows="5" class="form-control"></textarea>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
